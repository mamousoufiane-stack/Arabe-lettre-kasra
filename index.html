<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alphabet arabe - Kasra - Full local</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#eef8fc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0d3240}
body{padding:12px;display:flex;justify-content:center}
.app{width:min(100%,900px)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:white;border:2px solid #d9f0f7;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
.status{font-weight:800;color:#0098c8;min-height:1.4em}
button.ui{border:2px solid #cbeaf5;background:white;border-radius:12px;padding:10px 12px;font-weight:800;color:#0d3240;margin:2px}
.wrap{position:relative;width:100%;background:white;border-radius:14px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.14);user-select:none;touch-action:manipulation}
.wrap img{display:block;width:100%;height:auto}
.grid{position:absolute;left:.1%;right:.1%;top:9.25%;bottom:.25%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);pointer-events:none}
.cell{pointer-events:auto;border:0;background:transparent;padding:0;margin:0;border-radius:8px;cursor:pointer;touch-action:manipulation}
.cell:active,.cell.active{box-shadow:inset 0 0 0 6px rgba(0,150,200,.55);background:rgba(255,255,255,.22)}
.note{font-size:14px;line-height:1.4;margin-top:10px;background:white;border:1px solid #d9f0f7;border-radius:14px;padding:10px}
.debug{font-size:12px;white-space:pre-wrap;color:#38535c;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="status" id="status">Clique sur “Activer le son”, puis sur une lettre.</div>
    <div>
      <button class="ui" id="unlock" type="button">Activer le son</button>
      <button class="ui" id="test" type="button">Tester</button>
      <button class="ui" id="repeat" type="button">Répéter</button>
      <button class="ui" id="bonus" type="button">Son en plus</button>
    </div>
  </div>

  <div class="wrap">
    <img src="./alphabet_kasra.jpeg" alt="Alphabet arabe avec kasra">
    <div class="grid" id="grid"></div>
  </div>

  <div class="note">
    <b>Version full local :</b> tous les fichiers sont dans le même dossier que <code>index.html</code>.
    Dézippe le dossier, puis ouvre <code>index.html</code>. Ne déplace pas le fichier HTML seul.
    <div class="debug" id="debug"></div>
  </div>
</div>

<script>
const cells = [{"letter": "جِ", "name": "jim", "audio": "05.mp3"}, {"letter": "ثِ", "name": "tha", "audio": "04.mp3"}, {"letter": "تِ", "name": "ta", "audio": "03.mp3"}, {"letter": "بِ", "name": "ba", "audio": "02.mp3"}, {"letter": "إِ", "name": "alif", "audio": "01.mp3"}, {"letter": "رِ", "name": "ra", "audio": "10.mp3"}, {"letter": "ذِ", "name": "dhal", "audio": "09.mp3"}, {"letter": "دِ", "name": "dal", "audio": "08.mp3"}, {"letter": "خِ", "name": "kha", "audio": "07.mp3"}, {"letter": "حِ", "name": "ha", "audio": "06.mp3"}, {"letter": "ضِ", "name": "dad", "audio": "15.mp3"}, {"letter": "صِ", "name": "sad", "audio": "14.mp3"}, {"letter": "شِ", "name": "shin", "audio": "13.mp3"}, {"letter": "سِ", "name": "sin", "audio": "12.mp3"}, {"letter": "زِ", "name": "zay", "audio": "11.mp3"}, {"letter": "فِ", "name": "fa", "audio": "20.mp3"}, {"letter": "غِ", "name": "ghayn", "audio": "19.mp3"}, {"letter": "عِ", "name": "ayn", "audio": "18.mp3"}, {"letter": "ظِ", "name": "dha", "audio": "17.mp3"}, {"letter": "طِ", "name": "ta emphatique", "audio": "16.mp3"}, {"letter": "نِ", "name": "noun", "audio": "25.mp3"}, {"letter": "مِ", "name": "mim", "audio": "24.mp3"}, {"letter": "لِ", "name": "lam", "audio": "23.mp3"}, {"letter": "كِ", "name": "kaf", "audio": "22.mp3"}, {"letter": "قِ", "name": "qaf", "audio": "21.mp3"}, {"letter": "ىِ", "name": "alif maksoura", "audio": "30.mp3"}, {"letter": "يِ", "name": "ya", "audio": "29.mp3"}, {"letter": "ءِ", "name": "hamza", "audio": "28.mp3"}, {"letter": "وِ", "name": "waw", "audio": "27.mp3"}, {"letter": "هِ", "name": "ha", "audio": "26.mp3"}];
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const unlockBtn = document.getElementById('unlock');
const testBtn = document.getElementById('test');
const repeatBtn = document.getElementById('repeat');
const bonusBtn = document.getElementById('bonus');

let last = null;
let currentButton = null;
const audios = new Map();

function log(msg) {
  debugEl.textContent = msg;
}

function getAudio(file) {
  if (!audios.has(file)) {
    const a = new Audio();
    a.preload = 'auto';
    a.playsInline = true;
    a.setAttribute('playsinline', '');
    a.src = './' + file;
    audios.set(file, a);
  }
  return audios.get(file);
}

function stopAll() {
  for (const a of audios.values()) {
    try { a.pause(); a.currentTime = 0; } catch(e) {}
  }
  if (currentButton) currentButton.classList.remove('active');
}

async function unlockSound() {
  const first = getAudio('01.mp3');
  try {
    // Sur iOS, l'audio doit être appelé depuis un vrai clic utilisateur.
    first.volume = 0.01;
    await first.play();
    first.pause();
    first.currentTime = 0;
    first.volume = 1;
    statusEl.textContent = 'Son activé. Clique sur une lettre.';
    log('Audio activé. URL actuelle : ' + location.href);
  } catch(e) {
    statusEl.textContent = 'Son toujours bloqué par le navigateur.';
    log('Erreur activation : ' + (e && e.name ? e.name : e) + '\nURL : ' + location.href);
  }
}

async function play(file, label, btn) {
  stopAll();
  currentButton = btn || null;
  if (currentButton) currentButton.classList.add('active');

  const a = getAudio(file);
  last = {file, label, btn};

  try {
    a.currentTime = 0;
    statusEl.textContent = label;
    a.onended = () => {
      if (currentButton) currentButton.classList.remove('active');
    };
    await a.play();
    log('Lecture OK : ' + file + ' — ' + label);
  } catch(e) {
    statusEl.textContent = 'Son bloqué : appuie sur “Activer le son”.';
    log('Erreur lecture ' + file + ' : ' + (e && e.name ? e.name : e) + '\nURL : ' + location.href);
  }
}

cells.forEach((item) => {
  const b = document.createElement('button');
  b.className = 'cell';
  b.type = 'button';
  b.title = item.letter + ' - ' + item.name + ' - ' + item.audio;
  b.setAttribute('aria-label', item.letter + ' ' + item.name);

  // pointerup marche souvent mieux sur iPad que click/touchend seuls.
  b.addEventListener('pointerup', (ev) => {
    ev.preventDefault();
    play(item.audio, item.letter + ' — ' + item.name, b);
  });
  b.addEventListener('click', (ev) => {
    ev.preventDefault();
    play(item.audio, item.letter + ' — ' + item.name, b);
  });

  grid.appendChild(b);
});

unlockBtn.addEventListener('pointerup', (ev) => { ev.preventDefault(); unlockSound(); });
unlockBtn.addEventListener('click', (ev) => { ev.preventDefault(); unlockSound(); });
testBtn.addEventListener('click', () => play('01.mp3', 'Test audio', null));
repeatBtn.addEventListener('click', () => { if (last) play(last.file, last.label, last.btn); });
bonusBtn.addEventListener('click', () => play('31.mp3', 'Son supplémentaire détecté', null));

log('Fichiers attendus dans le même dossier : index.html, alphabet_kasra.jpeg, 01.mp3 à 31.mp3');
</script>
</body>
</html>
